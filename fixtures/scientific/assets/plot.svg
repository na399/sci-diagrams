<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="260" viewBox="0 0 400 260">
<title>Synthetic training curve</title>
<style type="text/css">text {font-family:sans-serif;font-size:16px;fill:#17202a}.curve {fill:none;stroke:#35566f;stroke-width:2}</style>
<defs><clipPath id="plot"><rect x="60" y="20" width="300" height="180"/></clipPath><circle id="dot" r="4" fill="#35566f"/></defs>
<path d="M 60 20 V 200 H 360" fill="none" stroke="#364152" stroke-width="1.5"/>
<path class="curve" d="M 60 165 L 160 110 L 260 60 L 360 50" clip-path="url(#plot)"/>
<use xlink:href="#dot" x="160" y="110"/><use xlink:href="#dot" x="260" y="60"/>
<text x="210" y="244" text-anchor="middle">Epoch</text><text x="18" y="110" text-anchor="middle" transform="rotate(-90 18 110)">AUROC</text>
<text x="50" y="205" text-anchor="end">0.0</text><text x="50" y="28" text-anchor="end">1.0</text><text x="60" y="224" text-anchor="middle">0</text><text x="360" y="224" text-anchor="middle">3</text>
</svg>
