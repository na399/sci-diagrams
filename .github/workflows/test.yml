name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/release.mjs check
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # Browser/version pin comes from the repository lockfile, not a developer's system Chrome.
      - run: pnpm --filter @eraserlabs/diagrams exec playwright install chromium --with-deps
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm -r typecheck
      - run: pnpm depcruise
      - run: pnpm lint
      - run: pnpm test
      # Includes legacy browser regressions and all scientific stack integration suites.
      - run: pnpm test:e2e
      - name: Scientific figures and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-stack-results
          if-no-files-found: ignore
          retention-days: 14
          path: |
            packages/diagrams/test-results
            packages/diagrams/playwright-report
            packages/render/test-results
            packages/render/playwright-report
